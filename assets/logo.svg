<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="TechMHA logo">
  <title>TechMHA</title>
  <defs>
    <linearGradient id="techmha-t-grad" x1="8" y1="14" x2="70" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#5c4fc7"/>
    </linearGradient>
    <linearGradient id="techmha-glow" x1="48" y1="4" x2="48" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c6f135" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c6f135" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square badge outline, matching the source mark's frame -->
  <rect x="4" y="4" width="88" height="88" rx="22" fill="none" stroke="url(#techmha-t-grad)" stroke-width="2.5" opacity="0.55"/>

  <!-- T bar + stem (violet, matches site accent), top edge slanted like the source mark's flag-cut T -->
  <path d="M14 24 L62 24 L51 35 L38.5 35 L38.5 74 L27 74 L27 35 L14 35 Z" fill="url(#techmha-t-grad)"/>

  <!-- "1" flag / pennant (lime, reads as the numeral and as a bright accent), angled top to match the T -->
  <path d="M54 24 L70 24 L70 74 L59 74 L59 39 L54 42 Z" fill="#c6f135" stroke="#0e0f18" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Circuit node trio, echoing the source logo's circuit-profile detail -->
  <g fill="none" stroke="#8b7cff" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <path d="M68 32 H76"/>
    <path d="M68 48 H80"/>
    <path d="M68 64 H76"/>
  </g>
  <circle cx="78.5" cy="32" r="3.2" fill="#0e0f18" stroke="#8b7cff" stroke-width="2"/>
  <circle cx="82.5" cy="48" r="3.2" fill="#0e0f18" stroke="#c6f135" stroke-width="2"/>
  <circle cx="78.5" cy="64" r="3.2" fill="#0e0f18" stroke="#8b7cff" stroke-width="2"/>
</svg>
